<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Crumble Crew screens</title>
<style>
:root { color-scheme: dark; }
body { background: #000; color: #fff; font: 17px/1.5 system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; }
main { max-width: 760px; margin: 0 auto; }
h1 { font-size: 24px; margin: 0 0 10px; }
p { margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
figure { margin: 0; }
img { width: 100%; height: auto; border-radius: 14px; display: block; }
figcaption { margin-top: 6px; }
</style>
</head>
<body data-mockup-diff="new-screens">
<main>
<h1>These are the five Crumble Crew screens, as built.</h1>
<p>Nothing for you to do here.</p>
<p>Every screen is new, so there is no before picture.</p>
<hr>
<div class="grid">
<figure><img src="1-play.jpg" alt="Play screen with a lighthouse sculpture" data-picture-ok="screenshot of our own game"><figcaption><b>1</b> Play: tap the front crew member of any column.</figcaption></figure>
<figure><img src="2-popping.jpg" alt="Crew on pads firing at a duck" data-picture-ok="screenshot of our own game"><figcaption><b>2</b> Popping: each pad fires at cubes of its colour.</figcaption></figure>
<figure><img src="3-win.jpg" alt="Win card with coins" data-picture-ok="screenshot of our own game"><figcaption><b>3</b> Win: coins, then the next level.</figcaption></figure>
<figure><img src="4-out-of-room.jpg" alt="Out of room card" data-picture-ok="screenshot of our own game"><figcaption><b>4</b> Out of room: the stuck pads glow red; add a pad or recall one.</figcaption></figure>
<figure><img src="5-settings.jpg" alt="Settings card with level picker" data-picture-ok="screenshot of our own game"><figcaption><b>5</b> Settings: sound, vibration, pick a level.</figcaption></figure>
</div>
</main>
</body>
</html>
