name: Ship to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  ship:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Rules and levels
        run: node --test test/*.test.mjs
      - name: Build the site folder
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest icon-*.png css js vendor _site/
          sed -i "s/<meta name=\"build\" content=\"dev\">/<meta name=\"build\" content=\"${GITHUB_SHA::7}\">/" _site/index.html
          grep -q "content=\"${GITHUB_SHA::7}\"" _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
