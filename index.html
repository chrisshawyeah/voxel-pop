<!doctype html>
<!-- long-ok: this is the game itself (app UI), not a page for Chris to read -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="build" content="dev">
<meta name="theme-color" content="#a9d6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crumble Crew">
<meta name="description" content="Crumble Crew: send your crew up to pop cube sculptures, one colour at a time. Levels only.">
<title>Crumble Crew</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/game.css">
<style>html,body{background:#a9d6ff;color:#1f2547}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="nav" id="prev" aria-label="Previous level"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
    <button class="title" id="again" aria-label="Restart this level">
      <h1 id="level-name">Level 1</h1>
      <span id="level-sub"></span>
    </button>
    <button class="nav" id="next" aria-label="Next level"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  </header>
  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="banner" id="banner" hidden></div>
  </main>
  <section class="pads" id="pads" aria-label="Launch pads"></section>
  <section class="queues" id="queues" aria-label="Your crew"></section>
</div>
<canvas id="fx"></canvas>

<label id="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<script type="module" src="js/main.js"></script>
</body>
</html>
