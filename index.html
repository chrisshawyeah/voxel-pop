<!doctype html>
<!-- long-ok: this is the game itself (app UI), not a page for Chris to read -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="build" content="dev">
<meta name="theme-color" content="#a9d6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crumble Crew">
<meta name="description" content="Crumble Crew: send your crew up to pop cube sculptures, one colour at a time. Levels only.">
<title>Crumble Crew</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/game.css">
<style>html,body{background:#a9d6ff;color:#1f2547}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<!-- fetch every script at once instead of one after another -->
<link rel="modulepreload" href="vendor/three.module.js">
<link rel="modulepreload" href="vendor/three.core.js">
<link rel="modulepreload" href="vendor/RoundedBoxGeometry.js">
<link rel="modulepreload" href="js/render.js">
<link rel="modulepreload" href="js/fx.js">
<link rel="modulepreload" href="js/audio.js">
<link rel="modulepreload" href="js/levels.js">
<link rel="modulepreload" href="js/logic.js">
<link rel="modulepreload" href="js/models.js">
</head>
<body>
<div id="app">
  <header class="top">
    <span aria-hidden="true"></span>
    <button class="nav" id="prev" aria-label="Previous level"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
    <button class="title" id="again" aria-label="Restart this level">
      <h1 id="level-name">&nbsp;</h1>
      <span class="sub"><span id="level-sub">&nbsp;</span><svg class="redo" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></span>
      <span class="progress" id="progress" aria-hidden="true"><i></i></span>
    </button>
    <button class="nav" id="next" aria-label="Next level"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    <button class="sound" id="sound" aria-label="Sound" aria-pressed="true">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path class="speaker" d="M3 9.5v5h4l5 4v-13l-5 4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path class="speaker" d="M3 9.5v5h4l5 4v-13l-5 4z"/><path d="m16 9.5 5 5m0-5-5 5"/></svg>
    </button>
  </header>
  <script>
    // The right level number and sound button from the first paint, before the game's scripts
    // arrive. A level number is rounded and kept inside 1 to LAST, as js/main.js does.
    (function () {
      var LAST = 20; // how many levels js/levels.js has
      function level(v, base) {
        if (v === null || v === undefined || !String(v).trim()) return NaN;
        var n = Math.round(Number(v)) - base;
        return isFinite(n) ? Math.min(LAST - 1, Math.max(0, n)) : NaN;
      }
      var n = level(new URLSearchParams(location.search).get('level'), 1), quiet = false;
      try {
        if (isNaN(n)) n = level(localStorage.getItem('crumble-crew.level'), 0);
        quiet = localStorage.getItem('crumble-crew.sound') === '0';
      } catch (e) { /* storage blocked */ }
      if (isNaN(n)) n = 0;
      document.getElementById('level-name').textContent = 'Level ' + (n + 1);
      document.getElementById('sound').setAttribute('aria-pressed', String(!quiet));
    })();
  </script>
  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="loading" id="loading"><span class="cubes"><i></i><i></i><i></i></span><b>Building the level</b></div>
    <div class="hint" id="hint" hidden><b>Tap the front crew</b><span>Crew pop the top cubes of their colour</span></div>
    <div class="banner" id="banner" role="status" hidden></div>
    <div class="ending" id="ending" role="status" hidden><b id="ending-title">All levels cleared</b><span>Tap to play again</span></div>
  </main>
  <section class="pads" id="pads" aria-label="Launch pads"></section>
  <section class="queues" id="queues" aria-label="Your crew"></section>
</div>
<canvas id="fx"></canvas>

<label id="haptic" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<script type="module" src="js/main.js"></script>
</body>
</html>
